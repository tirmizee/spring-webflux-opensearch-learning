name: Chapter Maven verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - chapter: 01-basic-connection
            artifact: 01-basic-connection
          - chapter: 02-security-and-tls
            artifact: 02-security-and-tls
          - chapter: 03-api-key-authentication
            artifact: 03-api-key-authentication
          - chapter: 04-index-mappings-and-settings
            artifact: 04-index-mappings-and-settings
          - chapter: 05-document-crud
            artifact: 05-document-crud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Check Docker availability
        run: docker version
      - name: Run unit and OpenSearch integration tests
        working-directory: ${{ matrix.chapter }}
        run: ./mvnw -B -ntp clean verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.artifact }}
          path: |
            ${{ matrix.chapter }}/target/surefire-reports/
            ${{ matrix.chapter }}/target/failsafe-reports/
          if-no-files-found: warn
