name: os-learning-ch01
services:
  opensearch:
    image: opensearchproject/opensearch:3.9.0
    environment:
      discovery.type: single-node
      cluster.name: learning-ch01
      node.name: learning-ch01-node
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:${OPENSEARCH_PORT:-9200}:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=3s' > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    volumes:
      - opensearch-data:/usr/share/opensearch/data
volumes:
  opensearch-data:
